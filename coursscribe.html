<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoursScribe IA — Notes de cours intelligentes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{--bg:#FEFEFF;--card:#F7F2FF;--line:#D9C9FF;--text:#2A1745;--muted:#6B4E9E;--accent:#7D4FFE;--light:#C49FFF;--pink:#FE277E;--red:#8A0D1E}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#FEFEFF}
h1{font-size:22px;margin:0}h1 span{color:#7D4FFE}
main{max-width:1200px;margin:0 auto;padding:18px;display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:#FEFEFF;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(125,79,254,.08)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,textarea,select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#FFFFFF;color:var(--text);font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:#EFE6FF;color:#2A1745}
button.primary{background:var(--accent);color:#fff}button.ai{background:var(--pink);color:#fff}button.danger{background:var(--red);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.course{padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;cursor:pointer;background:#FFFFFF}
.course.active{border-color:var(--accent);background:#F1E9FF}
.course b{display:block}.small{font-size:12px;color:var(--muted)}
.status{margin-top:10px;padding:9px;border-radius:9px;background:#FFFFFF;border:1px solid var(--line);font-size:13px}
.recording{border-color:var(--pink);color:var(--pink)}
.paused{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 12px;border-radius:999px;background:#FFFFFF;border:1px solid var(--line);font-size:13px}
.tab.active{background:var(--light);color:#2A1745;border-color:var(--light)}
#transcript,#formatted{white-space:pre-wrap;line-height:1.6;min-height:280px;background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:60vh}
#formatted h1,#formatted h2,#formatted h3{color:#7D4FFE}
#formatted ul{margin:5px 0 10px 20px}#formatted li{margin:4px 0}
.keyword{display:inline-block;background:#F1E9FF;color:#7D4FFE;border:1px solid var(--light);padding:3px 9px;border-radius:999px;margin:3px 4px 3px 0;font-size:12px}
.hide{display:none}
.toast{position:fixed;bottom:18px;right:18px;background:#7D4FFE;color:#fff;padding:11px 15px;border-radius:10px;font-weight:700;display:none;z-index:20}
</style>
</head>
<body>
<header>
<h1>🎓 Cours<span>Scribe IA</span></h1>
<div class="small">Extrait l’essentiel du cours, corrige les phrases et ignore les échanges inutiles.</div>
</header>

<main>
<section class="card">
<h2 style="margin-top:0">Mes cours</h2>
<label>Titre du cours</label><input id="title" placeholder="Ex. Économie — L’inflation">
<label>Matière</label><input id="subject" placeholder="Ex. Économie">
<label>Date</label><input id="date" type="date">
<button class="primary" id="newCourse">+ Nouveau cours</button>
<div id="courseList" style="margin-top:14px"></div>

<label>Clé API OpenAI</label>
<input id="apiKey" type="password" placeholder="sk-...">
<div class="small">La clé reste dans ce navigateur et n’est envoyée qu’à OpenAI lors de l’analyse.</div>
<label>Modèle</label>
<select id="model">
<option value="gpt-4o-mini">gpt-4o-mini — rapide et économique</option>
<option value="gpt-4o">gpt-4o — plus précis</option>
</select>
</section>

<section>
<div class="card">
<h2 style="margin-top:0" id="currentTitle">Aucun cours sélectionné</h2>
<div class="small" id="currentMeta"></div>
<div class="row" style="margin-top:12px">
<button class="primary" id="startBtn">🎙️ Démarrer</button>
<button id="pauseBtn" disabled>⏸️ Pause</button>
<button class="danger" id="stopBtn" disabled>⏹️ Arrêter</button>
<button id="downloadBtn" disabled>⬇️ Audio</button>
</div>
<div class="status" id="status">Micro inactif. Crée ou sélectionne un cours, puis démarre l’enregistrement.</div>
<label style="display:flex;gap:8px;align-items:center;margin:8px 0 0"><input type="checkbox" id="withAudio" style="width:auto"> Enregistrer aussi l’audio (peut perturber la dictée sur mobile)</label>
<div class="row" style="margin-top:10px">
<button id="formatBtn">✨ Mise en forme rapide</button>
<button class="ai" id="aiBtn">🤖 Analyse IA du cours</button>
<button id="saveBtn">💾 Enregistrer</button>
</div>
<div class="row" style="margin-top:10px">
<button id="pdfBtn">📄 Exporter PDF</button>
<button id="wordBtn">📝 Exporter Word</button>
<button id="pptBtn">📊 Exporter PowerPoint</button>
</div>
</div>

<div class="card" style="margin-top:16px">
<div class="tabs">
<button class="tab active" data-tab="transcript">Transcription</button>
<button class="tab" data-tab="formatted">Notes IA</button>
<button class="tab" data-tab="revision">Révision</button>
</div>
<div id="transcript" contenteditable="true"></div>
<div id="formatted" class="hide"></div>
<div id="revision" class="hide"></div>
</div>
</section>
</main>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let courses=JSON.parse(localStorage.getItem('coursscribe')||'[]');
let currentId=null,recorder=null,stream=null,chunks=[],audioUrl=null,recognition=null;
let listening=false,sessionActive=false,lastActivity=Date.now(),idleTimer=null;
const IDLE_LIMIT=5*60*1000;

function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function persist(){try{localStorage.setItem('coursscribe',JSON.stringify(courses))}catch(e){toast('Stockage local plein : exporte tes cours')}}
function save(){persist();renderCourses()}
function current(){return courses.find(c=>c.id===currentId)}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function renderCourses(){
  const box=$('courseList');box.innerHTML='';
  if(!courses.length){box.innerHTML='<div class="small">Aucun cours pour le moment.</div>';return}
  courses.slice().reverse().forEach(c=>{
    const d=document.createElement('div');d.className='course'+(c.id===currentId?' active':'');
    d.innerHTML=`<b>${escapeHtml(c.title)}</b><span class="small">${escapeHtml(c.subject||'—')} • ${c.date||'—'}</span>`;
    d.onclick=()=>selectCourse(c.id);box.appendChild(d);
  });
}

function selectCourse(id){
  if(sessionActive&&id!==recCourseId){toast('Arrête l’enregistrement avant de changer de cours');return}
  currentId=id;const c=current();if(!c)return;
  $('currentTitle').textContent=c.title;
  $('currentMeta').textContent=(c.subject||'Sans matière')+' • '+(c.date||'Sans date');
  $('transcript').innerText=c.transcript||'';
  $('formatted').innerHTML=sanitize(c.formatted||'');
  renderRevision(c);renderCourses();
}

$('newCourse').onclick=()=>{
  if(sessionActive)return toast('Arrête l’enregistrement avant de créer un cours');
  const title=$('title').value.trim()||'Cours sans titre';
  const c={id:Date.now().toString(),title,subject:$('subject').value.trim(),date:$('date').value,transcript:'',formatted:'',created:new Date().toISOString()};
  courses.push(c);save();selectCourse(c.id);$('title').value='';$('subject').value='';toast('Cours créé');
};

function setStatus(text,mode=''){const s=$('status');s.textContent=text;s.className='status '+mode}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IS_MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
let paused=false,recCourseId=null,restartTimer=null,netErrors=0,lastFinal={t:'',at:0},audioExt='webm';
$('withAudio').checked=!IS_MOBILE;
if(!SR)setStatus('⚠️ Dictée vocale non supportée ici. Utilise Chrome, Edge ou Safari récent (Firefox ne la gère pas).');
if(location.protocol==='file:'||!window.isSecureContext){
  const b=document.createElement('div');
  b.style.cssText='margin:12px 18px 0;padding:12px 14px;border-radius:10px;background:#FFF1F6;border:1px solid #FE277E;color:#8A0D1E;font-size:13px;line-height:1.5';
  b.innerHTML='⚠️ <b>Page ouverte en local (file://)</b> : Chrome redemande l’autorisation du micro à chaque redémarrage de la dictée. Pour qu’elle soit accordée une seule fois, ouvre cette page via <b>https</b> (ex. glisse le fichier sur app.netlify.com/drop) ou via <b>http://localhost</b>.';
  document.querySelector('header').after(b);
}

function markActivity(){} // plus de pause automatique : seule la pause manuelle arrête la transcription
function ensureSpan(){let sp=$('interimSpan');if(!sp){sp=document.createElement('span');sp.id='interimSpan';sp.contentEditable='false';sp.style.cssText='color:#6B4E9E;font-style:italic';$('transcript').appendChild(sp)}return sp}
function setInterim(t){const sp=ensureSpan();sp.textContent=t;if(t){const b=$('transcript');b.scrollTop=b.scrollHeight}}
function getTranscript(){const sp=$('interimSpan');const old=sp?sp.style.display:'';if(sp)sp.style.display='none';const t=getTranscript();if(sp)sp.style.display=old;return t}
let wake=null;
async function getWake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.onrelease=()=>{wake=null}}}catch(_){}}
function releaseWake(){try{wake&&wake.release()}catch(_){}wake=null}
function autoPause(){if(!sessionActive||paused)return;pauseSession();setStatus('⏸️ Pause automatique après 5 minutes sans voix. Clique sur « Réactiver le micro » pour reprendre.','paused');toast('Pause automatique : aucune voix détectée')}

function appendFinal(text){
  text=text.trim();if(!text)return;
  const now=Date.now();
  if(text===lastFinal.t&&now-lastFinal.at<1500)return; // doublons connus sur Android
  lastFinal={t:text,at:now};
  const c=courses.find(x=>x.id===recCourseId);if(!c)return;
  const box=$('transcript');
  setInterim('');box.insertBefore(document.createTextNode(text+' '),ensureSpan());
  c.transcript=getTranscript();box.scrollTop=box.scrollHeight;persist();
}

function startRecognition(){
  if(!SR)return;
  clearTimeout(restartTimer);
  if(recognition){const old=recognition;recognition=null;old.onend=null;try{old.abort()}catch(_){}}
  const rec=new SR();recognition=rec;
  rec.lang='fr-FR';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  rec.onresult=e=>{
    netErrors=0;let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal)appendFinal(r[0].transcript);else interim+=r[0].transcript;
    }
    setInterim(interim);
    if(!paused&&sessionActive)markActivity();
  };
  rec.onerror=e=>{
    if(e.error==='no-speech'||e.error==='aborted')return;
    const fatal={
      'not-allowed':'Permission micro refusée. Clique sur le cadenas de la barre d’adresse → Micro → Autoriser, puis recharge la page.',
      'service-not-allowed':'Le service de dictée est bloqué par le navigateur ou le système.',
      'audio-capture':'Aucun micro détecté, ou il est utilisé par une autre application ou un autre onglet.',
      'language-not-supported':'La langue fr-FR n’est pas supportée par ce navigateur.'};
    if(fatal[e.error]){pauseSession();setStatus('❌ '+fatal[e.error],'paused');return}
    if(e.error==='network'&&++netErrors>=5){pauseSession();setStatus('❌ La dictée a besoin d’Internet. Vérifie ta connexion puis réactive le micro.','paused')}
  };
  rec.onend=()=>{
    setInterim('');
    if(recognition!==rec)return;
    if(sessionActive&&!paused){
      restartTimer=setTimeout(()=>{if(recognition===rec&&sessionActive&&!paused){try{rec.start()}catch(_){startRecognition()}}},netErrors?1500:250);
    }else recognition=null;
  };
  try{rec.start()}catch(_){}
}

function pauseSession(){
  paused=true;releaseWake();clearTimeout(restartTimer);
  if(recognition){try{recognition.stop()}catch(_){}}
  if(recorder&&recorder.state==='recording')recorder.pause();
  $('pauseBtn').textContent='🔄 Réactiver le micro';
}
function resumeSession(){
  paused=false;netErrors=0;getWake();
  if(recorder&&recorder.state==='paused')recorder.resume();
  startRecognition();markActivity();
  $('pauseBtn').textContent='⏸️ Pause';
  setStatus('🎙️ Micro réactivé. Transcription en cours…','recording');
}

$('startBtn').onclick=async()=>{
  if(!current()){toast('Crée d’abord un cours');return}
  if(!SR&&!$('withAudio').checked){setStatus('⚠️ Ce navigateur ne gère pas la dictée : coche « Enregistrer aussi l’audio » ou utilise Chrome/Edge.');return}
  recCourseId=currentId;paused=false;netErrors=0;chunks=[];recorder=null;
  if($('withAudio').checked){
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
      recorder=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
      const mime=recorder.mimeType||'';audioExt=mime.includes('mp4')?'m4a':mime.includes('ogg')?'ogg':'webm';
      recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      recorder.onstop=()=>{
        if(chunks.length){if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(new Blob(chunks,{type:mime||'audio/webm'}));$('downloadBtn').disabled=false}
        if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
      };
      recorder.start(1000);
    }catch(e){
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
      recorder=null;
      const msgs={NotAllowedError:'Permission micro refusée. Autorise le micro (cadenas de la barre d’adresse) puis recharge la page.',NotFoundError:'Aucun micro détecté.',NotReadableError:'Le micro est utilisé par une autre application.'};
      if(e.name==='NotAllowedError'||e.name==='NotFoundError'||!SR){setStatus('❌ '+(msgs[e.name]||'Micro indisponible : '+e.message));return}
      toast('Audio non enregistré : dictée seule');
    }
  }
  sessionActive=true;startRecognition();getWake();
  $('startBtn').disabled=true;$('pauseBtn').disabled=false;$('stopBtn').disabled=false;$('pauseBtn').textContent='⏸️ Pause';
  setStatus('🎙️ Micro actif. Parle normalement : la transcription continue jusqu’à ce que tu cliques sur Pause ou Arrêter.','recording');
};

$('pauseBtn').onclick=()=>{
  if(!sessionActive)return;
  if(!paused){pauseSession();setStatus('⏸️ Micro en pause. Clique sur « Réactiver le micro » pour reprendre.','paused')}
  else resumeSession();
};

$('stopBtn').onclick=()=>{
  sessionActive=false;paused=false;releaseWake();clearTimeout(restartTimer);
  if(recognition){try{recognition.stop()}catch(_){}}
  if(recorder&&recorder.state!=='inactive')recorder.stop();
  else if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('startBtn').disabled=false;$('pauseBtn').disabled=true;$('stopBtn').disabled=true;$('pauseBtn').textContent='⏸️ Pause';
  setTimeout(save,600);
  setStatus('Enregistrement terminé.'+(audioUrl?' Tu peux télécharger l’audio.':''));
};

$('transcript').addEventListener('input',()=>{const c=current();if(c){c.transcript=getTranscript();persist()}});
$('downloadBtn').onclick=()=>{if(!audioUrl)return;const a=document.createElement('a');a.href=audioUrl;a.download=safeName(current()?.title)+'.'+audioExt;document.body.append(a);a.click();a.remove()};
$('saveBtn').onclick=()=>{const c=current();if(!c)return;c.transcript=getTranscript();c.formatted=$('formatted').innerHTML;save();toast('Cours enregistré')};

$('formatBtn').onclick=()=>{
  const c=current();if(!c)return;
  c.transcript=getTranscript();
  c.formatted=localNotes(c.transcript,c.title,c.subject);
  $('formatted').innerHTML=c.formatted;renderRevision(c);save();toast('Mise en forme rapide terminée');
};

$('aiBtn').onclick=async()=>{
  const c=current();if(!c)return toast('Sélectionne un cours');
  const transcript=getTranscript().trim();
  if(transcript.length<40)return toast('La transcription est trop courte pour être analysée.');
  const key=$('apiKey').value.trim();
  if(!key)return toast('Ajoute ta clé API OpenAI pour utiliser l’analyse IA.');
  const model=$('model').value;
  $('aiBtn').disabled=true;$('aiBtn').textContent='🤖 Analyse en cours…';
  setStatus('🤖 L’IA analyse le cours, retire les échanges et prépare tes notes…');
  try{
    const res=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({
        model,
        temperature:.2,
        messages:[
          {role:'system',content:`Tu es un assistant spécialisé dans la création de notes de cours en français, claires, fidèles et utiles pour réviser.
Règles strictes :
1. Ne conserve que le contenu académique essentiel du professeur.
2. Ignore les salutations, questions d’élèves, réponses répétées, interruptions, hésitations, digressions et échanges hors sujet.
3. Corrige les phrases incomplètes, les erreurs évidentes de transcription et la ponctuation, sans inventer d’information.
4. Ne copie pas la transcription mot à mot : reformule de manière concise, précise et structurée.
5. Si une information est ambiguë ou absente, ne l’invente pas.
6. Répond uniquement en HTML simple : h2, h3, p, ul, li, b. Pas de markdown, pas de texte avant ou après le HTML.
Structure imposée :
<h2>Sujet du cours</h2>
<h3>Idée centrale</h3>
<h3>Notions essentielles</h3>
<h3>Explications importantes</h3>
<h3>Exemples et applications</h3>
<h3>À retenir</h3>
<h3>Questions probables à l’examen</h3>
Adapte les titres si certaines sections ne sont pas pertinentes.`},
          {role:'user',content:`Matière : ${c.subject||'non précisée'}\nTitre : ${c.title}\n\nTranscription brute du cours :\n${transcript}`}
        ]
      })
    });
    const data=await res.json();
    if(!res.ok)throw new Error(data.error?.message||'Erreur API');
    const content=data.choices?.[0]?.message?.content||'';
    if(!content)throw new Error('Réponse IA vide.');
    const clean=sanitize(content.replace(/^\s*```(?:html)?\s*|\s*```\s*$/g,''));
    c.formatted=clean;$('formatted').innerHTML=clean;document.querySelector('[data-tab=formatted]').click();renderRevision(c);save();
    setStatus('✅ Notes IA générées. Vérifie toujours les informations importantes avant révision.');
    toast('Analyse IA terminée');
  }catch(e){
    setStatus('❌ Analyse IA impossible : '+e.message);
    toast('Erreur lors de l’analyse IA');
  }finally{
    $('aiBtn').disabled=false;$('aiBtn').textContent='🤖 Analyse IA du cours';
  }
};

function sentences(text){
  const t=String(text||'').replace(/\s+/g,' ').trim();if(!t)return[];
  const out=[];
  (t.match(/[^.!?]+[.!?]*/g)||[]).forEach(x=>{x=x.trim();if(!x)return;const w=x.split(' ');
    if(w.length<=40)out.push(x);else for(let i=0;i<w.length;i+=30)out.push(w.slice(i,i+30).join(' '))});
  return out;
}
function keywords(text){
  const stop=new Set('le la les un une des du de et ou mais donc car que qui quoi dont à au aux en dans sur pour par avec sans chez vers ce cet cette ces mon ma mes ton ta tes son sa ses notre nos votre vos leur leurs je tu il elle on nous vous ils elles est sont être avoir fait faire plus très aussi alors comme si ne pas tout tous autre autres peut peuvent doit doivent'.split(' '));
  const freq={};text.toLowerCase().replace(/[^\p{L}\p{N}\s'-]/gu,' ').split(/\s+/).forEach(w=>{if(w.length>3&&!stop.has(w))freq[w]=(freq[w]||0)+1});
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,14).map(x=>x[0]);
}

function localNotes(text,title,subject){
  const s=sentences(text).filter(x=>x.length>25&&!/^(est-ce que|pourquoi|comment|qu'est-ce|qui|quoi|où|quand)/i.test(x));
  if(!s.length)return '<h2>Aucun contenu exploitable</h2><p>Ajoute une transcription plus longue ou utilise l’analyse IA.</p>';
  const chunk=Math.max(3,Math.ceil(s.length/6));
  let html=`<h2>${escapeHtml(title||'Cours')}</h2><p class="small">${escapeHtml(subject||'')} • ${new Date().toLocaleDateString('fr-FR')}</p>`;
  const kws=keywords(text);
  html+='<h3>Mots-clés</h3><div>'+kws.map(k=>`<span class="keyword">${escapeHtml(k)}</span>`).join('')+'</div>';
  html+='<h3>Contenu probablement important</h3><ul>';
  for(let i=0;i<s.length;i+=chunk)html+='<li>'+escapeHtml(s.slice(i,i+chunk).join(' '))+'</li>';
  html+='</ul><p class="small">Cette mise en forme rapide ne comprend pas le cours. Utilise « Analyse IA du cours » pour obtenir de vraies notes.</p>';
  return html;
}

function renderRevision(c){
  const box=$('revision'),text=c.transcript||'',kws=keywords(text),s=sentences(text);
  let html='<h3>Questions de révision</h3>';
  if(!s.length)html+='<p class="small">Aucune transcription disponible.</p>';
  else{html+='<ul>';s.slice(0,8).forEach((x,i)=>{html+=`<li><b>Question ${i+1} :</b> Explique : « ${escapeHtml(x.slice(0,120))}${x.length>120?'…':''} »</li>`});html+='</ul>'}
  html+='<h3>Mots-clés à mémoriser</h3>'+(kws.length?kws.map(k=>`<span class="keyword">${escapeHtml(k)}</span>`).join(''):'<span class="small">Aucun mot-clé détecté.</span>');
  html+='<h3>Méthode conseillée</h3><ul><li>Relis les notes IA juste après le cours.</li><li>Réponds aux questions sans regarder la transcription.</li><li>Réexplique chaque notion à voix haute.</li><li>Revois la fiche demain, puis dans 3 jours.</li></ul>';
  box.innerHTML=html;
}

const ALLOWED=new Set(['H2','H3','H4','P','UL','OL','LI','B','STRONG','I','EM','BR','SPAN','DIV']);
function sanitize(html){
  const doc=new DOMParser().parseFromString(String(html||''),'text/html');
  (function walk(n){
    [...n.childNodes].forEach(ch=>{
      if(ch.nodeType!==1)return;
      if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED'].includes(ch.tagName)){ch.remove();return}
      walk(ch);
      const cls=ch.getAttribute('class');
      [...ch.attributes].forEach(a=>ch.removeAttribute(a.name));
      if(cls==='keyword'||cls==='small')ch.setAttribute('class',cls);
      if(!ALLOWED.has(ch.tagName))ch.replaceWith(...ch.childNodes);
    });
  })(doc.body);
  return doc.body.innerHTML;
}
function htmlBlocks(html){
  const doc=new DOMParser().parseFromString(html||'','text/html'),out=[];
  doc.body.querySelectorAll('h1,h2,h3,h4,p,li').forEach(el=>{
    const t=el.textContent.replace(/\s+/g,' ').trim();
    if(t)out.push({t:/^H/.test(el.tagName)?'h'+el.tagName[1]:el.tagName==='LI'?'li':'p',text:t});
  });
  return out;
}
function cleanText(html){return htmlBlocks(html).map(b=>b.text).join('\n')}
function safeName(s){return (s||'cours').replace(/[^\w\-àâäéèêëîïôöùûüçÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ ]+/g,'').replace(/\s+/g,'_').slice(0,70)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}

$('pdfBtn').onclick=()=>{
  const c=current();if(!c)return toast('Sélectionne un cours');
  if(!window.jspdf){toast('Bibliothèque PDF non chargée.');return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});
  const M=45,W=505;
  const fix=t=>String(t||'').replace(/[\u00A0\u202F\u2009]/g,' ').replace(/[^\x09\x0A\x20-\x7E\u00A1-\u00FF\u0152\u0153\u2013\u2014\u2018\u2019\u201C\u201D\u2022\u2026\u20AC]/g,'');
  let y=145;
  const bg=()=>{doc.setFillColor(254,254,255);doc.rect(0,0,595,842,'F')};
  const page=()=>{doc.addPage();bg();y=55};
  bg();doc.setFillColor(125,79,254);doc.rect(0,0,595,110,'F');doc.setFillColor(254,39,126);doc.rect(0,108,595,6,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(20);
  doc.text(doc.splitTextToSize(fix(c.title||'Cours'),W).slice(0,2),M,50);
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.text(fix((c.subject||'Sans matière')+' • '+(c.date||new Date().toLocaleDateString('fr-FR'))),M,92);
  doc.setTextColor(42,23,69);
  const write=(text,size,bold,indent=0,gap=4)=>{
    doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);
    doc.splitTextToSize(fix(text),W-indent).forEach(l=>{if(y>790)page();doc.text(l,M+indent,y);y+=size*1.4});
    y+=gap;
  };
  const blocks=htmlBlocks(c.formatted);
  if(blocks.length)blocks.forEach(b=>{
    if(b.t==='h1'||b.t==='h2'){if(y>720)page();y+=6;write(b.text,16,true,0,6)}
    else if(b.t[0]==='h'){if(y>740)page();y+=4;write(b.text,13,true,0,4)}
    else if(b.t==='li')write('• '+b.text,11,false,10,2);
    else write(b.text,11,false,0,6);
  });else write('Aucune note IA générée.',11,false);
  if(y>700)page();y+=14;write('Transcription',16,true,0,6);
  (c.transcript||'Aucune transcription.').split(/\n+/).forEach(p=>write(p,10.5,false,0,6));
  doc.save(safeName(c.title)+'.pdf');toast('PDF téléchargé');
};

$('pptBtn').onclick=async()=>{
  const c=current();if(!c)return toast('Sélectionne un cours');
  if(!window.PptxGenJS){toast('Bibliothèque PowerPoint non chargée.');return}
  const pptx=new PptxGenJS();pptx.layout='LAYOUT_16x9';
  const titleSlide=pptx.addSlide();titleSlide.background={color:'FEFEFF'};
  titleSlide.addShape(pptx.ShapeType.rect,{x:0,y:0,w:10,h:.18,fill:{color:'FE277E'}});
  titleSlide.addText(c.title||'Cours',{x:.6,y:2.1,w:8.8,h:1.2,fontSize:36,bold:true,color:'7D4FFE'});
  titleSlide.addText((c.subject||'Sans matière')+' • '+(c.date||''),{x:.65,y:3.3,w:8.8,h:.5,fontSize:16,color:'6B4E9E'});

  const kws=keywords(c.transcript||'');
  if(kws.length){
    const slide=pptx.addSlide();slide.background={color:'FEFEFF'};
    slide.addShape(pptx.ShapeType.rect,{x:0,y:0,w:10,h:.18,fill:{color:'7D4FFE'}});
    slide.addText('Mots-clés',{x:.5,y:.4,w:9,h:.7,fontSize:28,bold:true,color:'2A1745'});
    slide.addText(kws.map(k=>'• '+k).join('\n'),{x:.7,y:1.3,w:8.6,h:4.5,fontSize:20,color:'2A1745'});
  }

  const secs=[];let curS=null;
  htmlBlocks(c.formatted).forEach(b=>{
    if(b.t[0]==='h'){curS={title:b.text,items:[]};secs.push(curS)}
    else{if(!curS){curS={title:'Points essentiels',items:[]};secs.push(curS)}curS.items.push(b.text.slice(0,260))}
  });
  secs.filter(x=>x.items.length).forEach(x=>{
    for(let i=0;i<x.items.length;i+=5){
      const sl=pptx.addSlide();sl.background={color:'FEFEFF'};
      sl.addShape(pptx.ShapeType.rect,{x:0,y:0,w:10,h:.18,fill:{color:'7D4FFE'}});
      sl.addText(x.title+(x.items.length>5?' ('+(Math.floor(i/5)+1)+')':''),{x:.5,y:.35,w:9,h:.7,fontSize:24,bold:true,color:'2A1745',fit:'shrink'});
      sl.addText(x.items.slice(i,i+5).map(t=>({text:t,options:{bullet:true,breakLine:true}})),{x:.6,y:1.2,w:8.8,h:4.2,fontSize:16,color:'2A1745',valign:'top',fit:'shrink'});
    }
  });

  const rev=pptx.addSlide();rev.background={color:'FEFEFF'};
  rev.addShape(pptx.ShapeType.rect,{x:0,y:0,w:10,h:.18,fill:{color:'FE277E'}});
  rev.addText('Questions de révision',{x:.5,y:.45,w:9,h:.7,fontSize:28,bold:true,color:'7D4FFE'});
  const qs=sentences(c.transcript||'').slice(0,6).map((x,i)=>`${i+1}. Explique : ${x.slice(0,150)}`);
  rev.addText(qs.length?qs.join('\n'):'Aucune question disponible.',{x:.7,y:1.35,w:8.6,h:4.4,fontSize:16,color:'2A1745'});
  await pptx.writeFile({fileName:safeName(c.title)+'.pptx'});toast('PowerPoint téléchargé');
};
